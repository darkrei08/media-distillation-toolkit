[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-distillation-toolkit"
version = "0.1.0"
description = "Small, provenance-first helpers for validating manifests and rendering transcripts"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Project contributors" }]
dependencies = []

[project.scripts]
micio-distill = "media_distill.cli:main"

[tool.setuptools.packages.find]
include = ["media_distill*"]
